<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Poulailler Ste Marie — Inventaire &amp; œufs</title>
  <style>
:root {
  --ink: #1c1710;
  --ink-soft: #5a4e3e;
  --parchment: #efe4d0;
  --paper: #fffaf1;
  --paper-2: #f7efe1;
  --green: #234036;
  --green-mid: #2f5a4a;
  --green-deep: #152922;
  --leaf: #3d7a5f;
  --gold: #b47b1e;
  --gold-soft: #e8c98a;
  --terra: #a33b28;
  --terra-soft: #f3d4cc;
  --sage: #8aa894;
  --line: #e2d3ba;
  --line-strong: #cbb896;
  --ok: #2a7a4e;
  --warn: #b56a12;
  --shadow: 0 18px 40px rgba(28, 23, 16, 0.12);
  --radius: 18px;
  --sidebar: 268px;
  --font: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
  --ui: "Segoe UI", "Avenir Next", Calibri, system-ui, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--ui);
  color: var(--ink);
  background:
    radial-gradient(1200px 500px at 10% -10%, #f3e2c4 0%, transparent 50%),
    radial-gradient(900px 400px at 100% 0%, #dce8df 0%, transparent 46%),
    var(--parchment);
  min-height: 100%;
}

button, input, select, textarea { font-family: inherit; }
button { cursor: pointer; }
img { max-width: 100%; }

.app {
  display: grid;
  grid-template-columns: var(--sidebar) 1fr;
  min-height: 100%;
}

.sidebar {
  background: linear-gradient(180deg, var(--green-deep), var(--green) 55%, #1b332a);
  color: #f4ead8;
  padding: 22px 16px 18px;
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  gap: 8px;
  box-shadow: 8px 0 30px rgba(18, 30, 24, 0.18);
  z-index: 5;
}

.brand {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 6px 8px 16px;
  border-bottom: 1px solid rgba(244, 234, 216, 0.12);
  margin-bottom: 10px;
}
.brand-mark {
  width: 46px; height: 46px;
  border-radius: 14px;
  background: linear-gradient(145deg, #e8c98a, #c4922e);
  color: var(--green-deep);
  display: grid;
  place-items: center;
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.25);
}
.brand h1 {
  font-family: var(--font);
  font-size: 18px;
  margin: 0;
  letter-spacing: 0.02em;
  line-height: 1.15;
}
.brand p {
  margin: 3px 0 0;
  font-size: 11px;
  opacity: 0.72;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.nav-btn {
  appearance: none;
  border: 0;
  background: transparent;
  color: inherit;
  text-align: left;
  padding: 11px 12px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14.5px;
  opacity: 0.86;
}
.nav-btn svg { width: 18px; height: 18px; flex: 0 0 auto; }
.nav-btn:hover { background: rgba(255,255,255,0.06); }
.nav-btn.active {
  background: rgba(232, 201, 138, 0.16);
  color: #ffe9b5;
  opacity: 1;
  box-shadow: inset 3px 0 0 var(--gold-soft);
}

.sidebar-foot {
  margin-top: auto;
  padding: 12px 10px 4px;
  font-size: 11px;
  line-height: 1.45;
  opacity: 0.62;
}

.main {
  padding: 28px 32px 80px;
  max-width: 1280px;
}

.view { display: none; }
.view.active { display: block; animation: rise 0.28s ease; }
@keyframes rise {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 16px;
  margin-bottom: 22px;
  flex-wrap: wrap;
}
.topbar h2 {
  font-family: var(--font);
  font-size: 32px;
  margin: 0;
  font-weight: 600;
  letter-spacing: -0.02em;
}
.topbar .lede {
  margin: 6px 0 0;
  color: var(--ink-soft);
  font-size: 14.5px;
}

.month-picker {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--paper);
  border: 1px solid var(--line);
  padding: 6px;
  border-radius: 999px;
  box-shadow: var(--shadow);
}
.month-picker button {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 0;
  background: var(--paper-2);
  color: var(--green);
  font-size: 16px;
}
.month-picker input[type="month"] {
  border: 0;
  background: transparent;
  font-weight: 600;
  font-size: 14px;
  color: var(--ink);
  padding: 4px 8px;
}

.kpis {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin-bottom: 18px;
}
.kpi {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 18px 14px;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}
.kpi::after {
  content: "";
  position: absolute;
  right: -20px; top: -30px;
  width: 90px; height: 90px;
  border-radius: 50%;
  background: rgba(180, 123, 30, 0.08);
}
.kpi .label {
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-soft);
  font-weight: 700;
}
.kpi .value {
  font-family: var(--font);
  font-size: 30px;
  margin: 8px 0 2px;
  line-height: 1;
}
.kpi .hint { font-size: 12.5px; color: var(--ink-soft); }
.kpi.terra .value { color: var(--terra); }
.kpi.green .value { color: var(--green-mid); }
.kpi.gold .value { color: var(--gold); }

.grid-2 {
  display: grid;
  grid-template-columns: 1.35fr 0.9fr;
  gap: 16px;
}
.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}

.card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 18px 18px 16px;
  margin-bottom: 16px;
}
.card h3 {
  margin: 0 0 14px;
  font-family: var(--font);
  font-size: 20px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
}
.card h3 span { font-family: var(--ui); font-size: 12px; color: var(--ink-soft); font-weight: 600; }

.bars { display: flex; align-items: flex-end; gap: 4px; height: 140px; }
.bar-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100%;
  justify-content: flex-end;
  min-width: 0;
}
.bar {
  width: 100%;
  max-width: 18px;
  background: linear-gradient(180deg, var(--leaf), var(--green));
  border-radius: 6px 6px 2px 2px;
  min-height: 2px;
}
.bar.sale { background: linear-gradient(180deg, #d9893b, var(--terra)); }
.bar-col small {
  font-size: 9px;
  color: var(--ink-soft);
  margin-top: 4px;
}

.table-wrap { overflow: auto; border-radius: 12px; border: 1px solid var(--line); }
table.data {
  width: 100%;
  border-collapse: collapse;
  font-size: 13.5px;
  background: #fffdf8;
}
table.data th {
  background: var(--green);
  color: #f6edd8;
  font-weight: 650;
  letter-spacing: 0.03em;
  padding: 10px 8px;
  text-align: right;
  white-space: nowrap;
  position: sticky;
  top: 0;
}
table.data th:first-child, table.data td:first-child { text-align: left; }
table.data td {
  padding: 6px 8px;
  border-bottom: 1px solid var(--line);
  text-align: right;
}
table.data tbody tr:nth-child(even) { background: #f8f1e4; }
table.data tbody tr:hover { background: #efe3c8; }
table.data tfoot td {
  font-weight: 750;
  background: #efe2c8;
  border-top: 2px solid var(--gold);
}
table.data input[type="number"], table.data input[type="text"] {
  width: 72px;
  padding: 5px 6px;
  border: 1px solid transparent;
  background: transparent;
  text-align: right;
  border-radius: 8px;
  color: inherit;
}
table.data input.wide {
  width: 100%;
  min-width: 110px;
  text-align: left;
}
table.data input.mid { width: 88px; }
table.data input:focus {
  outline: 0;
  background: #fff;
  border-color: var(--gold);
}
table.data .muted { color: var(--ink-soft); }
table.data .warn td, table.data td.warn { color: var(--terra); font-weight: 700; }
.today-row { outline: 2px solid var(--gold); outline-offset: -2px; }

.form-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
.field { display: flex; flex-direction: column; gap: 6px; }
.field.span-2 { grid-column: span 2; }
.field.span-4 { grid-column: span 4; }
.field label {
  font-size: 11px;
  font-weight: 750;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.field input, .field select, .field textarea {
  border: 1px solid var(--line-strong);
  background: #fff;
  border-radius: 12px;
  padding: 10px 12px;
  font-size: 15px;
  color: var(--ink);
}
.field textarea { min-height: 84px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus {
  outline: 2px solid rgba(180,123,30,0.35);
  border-color: var(--gold);
}

.btn {
  border: 0;
  border-radius: 12px;
  padding: 10px 14px;
  font-weight: 700;
  font-size: 14px;
}
.btn-primary { background: var(--green); color: #f7edd8; }
.btn-primary:hover { background: var(--green-mid); }
.btn-gold { background: var(--gold); color: #1c1408; }
.btn-ghost {
  background: transparent;
  border: 1px solid var(--line-strong);
  color: var(--ink);
}
.btn-danger { background: var(--terra); color: white; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 9px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  background: var(--paper-2);
  border: 1px solid var(--line);
}
.pill.ok { background: #e3f1e7; color: var(--ok); border-color: #b7d8c2; }
.pill.bad { background: var(--terra-soft); color: var(--terra); border-color: #e4b4a8; }
.pill.gold { background: #f8ebcf; color: #8a5a10; border-color: var(--gold-soft); }

.preview-stock {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 14px 16px;
  border-radius: 14px;
  background: linear-gradient(90deg, #243f35, #3b6a55);
  color: #f6edd8;
  margin-top: 8px;
}
.preview-stock b { font-family: var(--font); font-size: 26px; }

.list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.item {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 10px;
  align-items: center;
  padding: 12px 12px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: #fffdf8;
}
.item h4 { margin: 0; font-size: 15px; }
.item p { margin: 3px 0 0; font-size: 12.5px; color: var(--ink-soft); }

.flock-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
.flock {
  background: #fffdf8;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 14px;
  min-height: 168px;
  position: relative;
}
.flock .bldg {
  font-family: var(--font);
  font-size: 28px;
  color: var(--green);
  line-height: 1;
}
.flock .count {
  font-size: 22px;
  font-weight: 750;
  margin-top: 10px;
}
.flock .meta { font-size: 12.5px; color: var(--ink-soft); margin-top: 4px; line-height: 1.45; }
.flock .cat {
  position: absolute;
  top: 12px; right: 12px;
}

.dest-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 4px 0 12px;
  font-size: 12px;
  color: var(--ink-soft);
}

.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(22, 16, 10, 0.45);
  display: none;
  place-items: center;
  z-index: 40;
  padding: 20px;
}
.modal-bg.open { display: grid; }
.modal {
  background: var(--paper);
  width: min(560px, 100%);
  border-radius: 20px;
  padding: 22px;
  box-shadow: 0 30px 80px rgba(0,0,0,.28);
  max-height: 90vh;
  overflow: auto;
}

.toast {
  position: fixed;
  bottom: 22px;
  right: 22px;
  background: var(--green-deep);
  color: #f6edd8;
  padding: 12px 16px;
  border-radius: 12px;
  display: none;
  z-index: 50;
  box-shadow: var(--shadow);
}
.toast.show { display: block; animation: rise 0.2s ease; }

.help {
  font-size: 13px;
  color: var(--ink-soft);
  line-height: 1.5;
}

.split-actions { display: flex; gap: 8px; align-items: center; }

.valeurs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 12px;
}
.val-box {
  background: #fffdf8;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 14px;
}
.val-box .k { font-size: 11px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.val-box .n { font-family: var(--font); font-size: 22px; margin-top: 4px; }
.val-box .s { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }

.alert {
  background: #f8ebcf;
  border: 1px solid var(--gold-soft);
  border-radius: 12px;
  padding: 10px 12px;
  font-size: 13px;
  margin: 8px 0 12px;
}
.modal.wide { width: min(720px, 100%); }

@media (max-width: 840px) {
  .valeurs { grid-template-columns: 1fr; }
}

@media (max-width: 1080px) {
  .kpis, .flock-grid, .grid-3 { grid-template-columns: 1fr 1fr; }
  .grid-2, .form-grid { grid-template-columns: 1fr 1fr; }
  .field.span-2, .field.span-4 { grid-column: span 2; }
}
@media (max-width: 840px) {
  .app { grid-template-columns: 1fr; }
  .sidebar {
    position: sticky;
    top: 0;
    height: auto;
    flex-direction: row;
    flex-wrap: wrap;
    padding: 10px;
    gap: 4px;
  }
  .brand { width: 100%; padding: 4px 6px 8px; margin-bottom: 4px; }
  .nav-btn { padding: 8px 10px; font-size: 13px; }
  .sidebar-foot { display: none; }
  .main { padding: 16px 12px 40px; }
  .kpis, .flock-grid, .grid-2, .grid-3, .form-grid { grid-template-columns: 1fr; }
  .field.span-2, .field.span-4 { grid-column: span 1; }
  .topbar h2 { font-size: 26px; }
  table.data input { width: 58px; }
}

@media print {
  body { background: white; }
  .sidebar, .btn-row, .month-picker button, .toast, .no-print { display: none !important; }
  .app { display: block; }
  .view { display: none !important; }
  .view.active { display: block !important; }
  .card, .kpi { box-shadow: none; }
  .main { padding: 0; max-width: none; }
}

  .nav-btn svg { width: 18px; height: 18px; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" id="brand-mark"></div>
        <div>
          <h1>Poulailler Ste Marie</h1>
          <p>Bouaké · Inventaire</p>
        </div>
      </div>
      <button class="nav-btn active" data-view="dashboard">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10.5 12 4l8 6.5V20H4z"/><path d="M9 20v-6h6v6"/></svg>
        Tableau de bord
      </button>
      <button class="nav-btn" data-view="saisie">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 19h14M7 16V8m5 8V5m5 11v-6"/></svg>
        Saisie du jour
      </button>
      <button class="nav-btn" data-view="fiche">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
        Fiche œufs
      </button>
      <button class="nav-btn" data-view="ventes">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M9.5 10.5c.7-1 4.3-1 5 1s-1.5 2.5-2.5 2.5"/></svg>
        Ventes
      </button>
      <button class="nav-btn" data-view="credits">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 7h14v12H5z"/><path d="M8 7V5h8v2M8 12h5"/></svg>
        Crédits / tournées
      </button>
      <button class="nav-btn" data-view="cheptel">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 18c2-6 6-9 8-9s4 1 8 9M9 9c0-3 1.5-5 3-5s3 2 3 5"/></svg>
        Cheptel
      </button>
      <button class="nav-btn" data-view="stock">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h16l-1 12H5L4 8z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/></svg>
        Pharmacie
      </button>
      <button class="nav-btn" data-view="aliment">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20h16M6 20 8 8h8l2 12M10 8V5m4 3V5"/></svg>
        Aliment
      </button>
      <button class="nav-btn" data-view="inventaire">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 4h10v16H7z"/><path d="M7 8h10M10 4v4"/></svg>
        Inventaire
      </button>
      <button class="nav-btn" data-view="params">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M4.9 6.5l1.5 1.5M17.6 16l1.5 1.5M3 12h2M19 12h2M4.9 17.5l1.5-1.5M17.6 8l1.5-1.5"/></svg>
        Paramètres
      </button>
      <div class="sidebar-foot">
        Monastère Bénédictin Ste Marie<br>
        01 BP 511 Bouaké 01<br>
        Fichier unique — fonctionne hors connexion.
      </div>
    </aside>
    <main class="main">
      <section class="view active" id="view-dashboard"></section>
      <section class="view" id="view-saisie"></section>
      <section class="view" id="view-fiche"></section>
      <section class="view" id="view-ventes"></section>
      <section class="view" id="view-credits"></section>
      <section class="view" id="view-cheptel"></section>
      <section class="view" id="view-stock"></section>
      <section class="view" id="view-aliment"></section>
      <section class="view" id="view-inventaire"></section>
      <section class="view" id="view-params"></section>
    </main>
  </div>
  <div class="modal-bg" id="modal"></div>
  <div class="toast" id="toast"></div>
  <script>
const KEY = "poulailler-ste-marie-v1";
const ORG = {
  name: "Monastère Bénédictin Ste Marie",
  address: "01 BP 511 BOUAKE 01",
  tel: "08 00 28 43 / 59 45 50 99",
};

const MONTHS_FR = [
  "janvier","février","mars","avril","mai","juin",
  "juillet","août","septembre","octobre","novembre","décembre"
];

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function pad(n) { return String(n).padStart(2, "0"); }
function ymd(d) {
  const x = d instanceof Date ? d : new Date(d);
  return `${x.getFullYear()}-${pad(x.getMonth() + 1)}-${pad(x.getDate())}`;
}
function daysInMonth(ym) {
  const [y, m] = ym.split("-").map(Number);
  return new Date(y, m, 0).getDate();
}
function addMonths(ym, delta) {
  const [y, m] = ym.split("-").map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
}
function formatFCFA(n) {
  const v = Math.round(Number(n) || 0);
  const sign = v < 0 ? "-" : "";
  return sign + Math.abs(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, "\u00a0") + " F";
}
function num(v) {
  if (v === "" || v == null) return 0;
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"'`]/g, (c) => ({

}

function weeksSince(dateStr, asOf) {
  if (!dateStr) return 0;
  const a = new Date(dateStr + "T00:00:00");
  const b = asOf ? new Date(asOf + "T00:00:00") : new Date();
  const days = Math.floor((b - a) / 86400000);
  return Math.max(0, Math.floor(days / 7));
}

function migrate(data) {
  const base = seed();
  const settings = { ...base.settings, ...(data.settings || {}) };
  if (!settings.priceSchemeV2) {
    settings.prixCuisine = 2000;
    settings.prixAumone = 1200;
    settings.prixLiberal = 1700;
    settings.prixCreditPlateau = settings.prixCreditPlateau || 2267;
    settings.priceSchemeV2 = true;
  }
  settings.prixAumone = settings.prixAumone ?? 1200;
  settings.prixLiberal = settings.prixLiberal ?? 1700;
  settings.prixCuisine = settings.prixCuisine ?? 2000;
  let credits = data.credits;
  let sales = data.sales || [];
  if (!credits) {
    credits = sales.filter((s) => s.payment === "credit").map((s) => ({
      id: s.id || uid(), date: s.date, client: s.client || "À renseigner", phone: "",
      kind: s.kind, qty: s.qty, unit: s.unit || (s.kind === "oeufs" ? "pltx" : "têtes"),
      unitPrice: s.unitPrice, total: s.total, paid: 0, due: "", note: s.note || "",
      tournee: s.kind === "oeufs",
    }));
    sales = sales.filter((s) => s.payment !== "credit");
  }
  return {
    ...base, ...data, settings,
    eggs: data.eggs || {},
    flocks: data.flocks || base.flocks,
    sales,
    credits,
    entities: (data.entities && data.entities.length) ? data.entities : base.entities,
    vet: data.vet || [],
    feed: data.feed || [],
    flockEvents: data.flockEvents || [],
    monthNotes: data.monthNotes || {},
  };
}

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return seed();
    return migrate(JSON.parse(raw));
  } catch {
    return seed();
  }
}

function emptyDay() {
  return { stockInitial: null, entree: 0, vente: 0, cuisine: 0, aumone: 0, liberalite: 0, tournee: 0, nonComm: 0, venteMontant: 0 };
}
function getDay(date) { return { ...emptyDay(), ...(state.eggs[date] || {}) }; }
function stockFinalOf(rec) {
  return num(rec.stockInitial) + num(rec.entree) - num(rec.vente) - num(rec.cuisine)
    - num(rec.aumone) - num(rec.liberalite) - num(rec.tournee) - num(rec.nonComm);
}
function previousDate(date) {
  const d = new Date(date + "T00:00:00");
  d.setDate(d.getDate() - 1);
  return ymd(d);
}
function lastKnownStock(date, hops = 0) {
  if (hops > 800) return 0;
  const rec = state.eggs[date];
  if (!rec) return lastKnownStock(previousDate(date), hops + 1);
  const si = rec.stockInitial != null && rec.stockInitial !== ""
    ? num(rec.stockInitial)
    : lastKnownStock(previousDate(date), hops + 1);
  return stockFinalOf({ ...emptyDay(), ...rec, stockInitial: si });
}
function resolvedDay(date) {
  const rec = getDay(date);
  const stockInitial = rec.stockInitial != null && rec.stockInitial !== ""
    ? num(rec.stockInitial)
    : lastKnownStock(previousDate(date));
  const full = { ...rec, stockInitial };
  return { ...full, stockFinal: stockFinalOf(full) };
}
function monthDates(ym) {
  return Array.from({ length: daysInMonth(ym) }, (_, i) => `${ym}-${pad(i + 1)}`);
}

function entityName(type) {
  const e = (state.entities || []).find((x) => x.id === type || x.type === type);
  if (e) return e.name;
  return { cuisine: "Cuisine", aumone: "Aumône", liberal: "Libéralité" }[type] || type;
}
function creditStatus(c) {
  const paid = num(c.paid), tot = num(c.total);
  if (tot <= 0 || paid >= tot) return "solde";
  if (paid > 0) return "partiel";
  return "ouvert";
}
function monthCredits(ym) {
  return (state.credits || []).filter((c) => c.date.startsWith(ym));
}

function monthStats(ym) {
  const rows = monthDates(ym).map(resolvedDay);
  const sum = (k) => rows.reduce((a, r) => a + num(r[k]), 0);
  const ventesArgent = (state.sales || []).filter((s) => s.date.startsWith(ym));
  const cash = ventesArgent.filter((s) => s.payment === "especes").reduce((a, s) => a + num(s.total), 0);
  const credits = monthCredits(ym);
  const credit = credits.reduce((a, s) => a + num(s.total), 0);
  const creditPaid = credits.reduce((a, s) => a + num(s.paid), 0);
  const volaillesCuisine = ventesArgent.filter((s) => s.payment === "cuisine").reduce((a, s) => a + num(s.total), 0);
  const s = state.settings;
  const cuisine = sum("cuisine"), aumone = sum("aumone"), liberalite = sum("liberalite");
  const cuisineOeufs = cuisine * num(s.prixCuisine);
  return {
    rows, entree: sum("entree"), vente: sum("vente"), cuisine, aumone, liberalite,
    tournee: sum("tournee"), nonComm: sum("nonComm"),
    stockDebut: rows[0].stockInitial, stockFin: rows[rows.length - 1].stockFinal,
    cash, credit, creditPaid, creditDue: credit - creditPaid, credits,
    creditOeufsQty: credits.filter((c) => c.kind === "oeufs").reduce((a, c) => a + num(c.qty), 0),
    cuisineOeufs, cuisineVolailles: volaillesCuisine,
    cuisineVal: cuisineOeufs + volaillesCuisine,
    aumoneVal: aumone * num(s.prixAumone),
    liberalVal: liberalite * num(s.prixLiberal),
    sales: ventesArgent,
  };
}

function flockTotals() {
  const t = { pondeuse: 0, poulette: 0, coq: 0, autre: 0 };
  state.flocks.forEach((f) => { t[f.category] = (t[f.category] || 0) + num(f.count); });
  t.all = t.pondeuse + t.poulette + t.coq + t.autre;
  return t;
}

function bindSaisieLive() {
  const s = state.settings;
  const update = () => {
    const rec = {
      stockInitial: num(document.getElementById("f-si").value),
      entree: num(document.getElementById("f-e").value),
      vente: num(document.getElementById("f-v").value),
      cuisine: num(document.getElementById("f-c").value),
      aumone: num(document.getElementById("f-a").value),
      liberalite: num(document.getElementById("f-l").value),
      tournee: num(document.getElementById("f-t").value),
      nonComm: num(document.getElementById("f-nc").value),
    };
    const el = document.getElementById("live-stock");
    if (el) el.querySelector("b").textContent = stockFinalOf(rec) + " pltx";
    const set = (id, v, sid, sub) => {
      const n = document.getElementById(id); if (n) n.textContent = v;
      const p = document.getElementById(sid); if (p) p.textContent = sub;
    };
    set("lv-c", formatFCFA(rec.cuisine * s.prixCuisine), "ls-c", rec.cuisine + " × " + formatFCFA(s.prixCuisine));
    set("lv-a", formatFCFA(rec.aumone * s.prixAumone), "ls-a", rec.aumone + " × " + formatFCFA(s.prixAumone));
    set("lv-l", formatFCFA(rec.liberalite * s.prixLiberal), "ls-l", rec.liberalite + " × " + formatFCFA(s.prixLiberal));
  };
  ["f-si","f-e","f-v","f-c","f-a","f-l","f-t","f-nc"].forEach((id) => {
    const el = document.getElementById(id);
    if (el) el.addEventListener("input", update);
  });
  const d = document.getElementById("saisie-date");
  if (d) d.addEventListener("change", () => {
    ui.saisieDate = d.value;
    ui.month = d.value.slice(0, 7);
    renderSaisie();
  });
}

function collectSaisie() {
  return {
    stockInitial: num(document.getElementById("f-si").value),
    entree: num(document.getElementById("f-e").value),
    vente: num(document.getElementById("f-v").value),
    cuisine: num(document.getElementById("f-c").value),
    aumone: num(document.getElementById("f-a").value),
    liberalite: num(document.getElementById("f-l").value),
    tournee: num(document.getElementById("f-t").value),
    nonComm: num(document.getElementById("f-nc").value),
    venteMontant: num(document.getElementById("f-vm").value),
  };
}

function saveSaisie(goNext) {
  const date = document.getElementById("saisie-date").value;
  const rec = collectSaisie();
  state.eggs[date] = rec;
  const nextD = new Date(date + "T00:00:00"); nextD.setDate(nextD.getDate() + 1);
  const next = ymd(nextD);
  if (!state.eggs[next]) state.eggs[next] = { ...emptyDay(), stockInitial: stockFinalOf(rec) };
  else if (state.eggs[next].stockInitial == null) state.eggs[next].stockInitial = stockFinalOf(rec);
  if (rec.venteMontant > 0) {
    const existing = state.sales.find((s) => s.date === date && s.kind === "oeufs" && s.payment === "especes" && s.note === "Saisie quotidienne");
    const row = {
      id: existing ? existing.id : uid(), date, kind: "oeufs", qty: rec.vente, unit: "pltx",
      unitPrice: rec.vente ? Math.round(rec.venteMontant / rec.vente) : state.settings.prixPlateau,
      total: rec.venteMontant, payment: "especes",
      client: document.getElementById("f-note").value || "Vente du jour", note: "Saisie quotidienne",
    };
    if (existing) Object.assign(existing, row); else state.sales.push(row);
  }
  save();
  toast("Journée " + date + " enregistrée");
  ui.saisieDate = goNext ? next : date;
  if (goNext) ui.month = next.slice(0, 7);
  render();
}

function upsertCredit(id, row, syncTournee) {
  if (!state.credits) state.credits = [];
  if (id) {
    const i = state.credits.findIndex((c) => c.id === id);
    if (i >= 0) state.credits[i] = { ...state.credits[i], ...row, id };
    else state.credits.push({ ...row, id: uid() });
  } else {
    state.credits.push({ ...row, id: uid() });
    if (syncTournee && row.kind === "oeufs") {
      const rec = getDay(row.date);
      rec.tournee = num(rec.tournee) + num(row.qty);
      if (rec.stockInitial == null) rec.stockInitial = lastKnownStock(previousDate(row.date));
      state.eggs[row.date] = rec;
    }
  }
  save();
}

document.addEventListener("click", (e) => {
  const nav = e.target.closest(".nav-btn");
  if (nav) { setView(nav.dataset.view); return; }
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const act = btn.dataset.action;

  if (act === "goto") setView(btn.dataset.view);
  if (act === "month-delta") { ui.month = addMonths(ui.month, Number(btn.dataset.delta)); render(); }
  if (act === "save-saisie") saveSaisie(false);
  if (act === "save-saisie-next") saveSaisie(true);
  if (act === "print") window.print();
  if (act === "close-modal") closeModal();
  if (act === "open-flock") flockForm(null);
  if (act === "edit-flock") flockForm(state.flocks.find((f) => f.id === btn.dataset.id));
  if (act === "save-flock") {
    const row = {
      id: btn.dataset.id || uid(),
      building: document.getElementById("m-b").value || "?",
      breed: document.getElementById("m-br").value,
      category: document.getElementById("m-c").value,
      startDate: document.getElementById("m-d").value,
      count: num(document.getElementById("m-n").value),
      notes: document.getElementById("m-note").value,
    };
    const i = state.flocks.findIndex((f) => f.id === row.id);
    if (i >= 0) state.flocks[i] = row; else state.flocks.push(row);
    save(); closeModal(); render(); toast("Bande enregistrée");
  }
  if (act === "del-flock") {
    state.flocks = state.flocks.filter((f) => f.id !== btn.dataset.id);
    save(); closeModal(); render();
  }
  if (act === "mortality") {
    const f = state.flocks.find((x) => x.id === btn.dataset.id);
    openModal(`
      <h3 style="font-family:var(--font);margin:0 0 12px">Mortalité — bât. ${esc(f.building)}</h3>
      <div class="form-grid" style="grid-template-columns:1fr 1fr">
        <div class="field"><label>Date</label><input type="date" id="mo-d" value="${todayStr()}"></div>
        <div class="field"><label>Nombre</label><input type="number" id="mo-n" value="1"></div>
        <div class="field span-2"><label>Type</label>
          <select id="mo-t"><option value="mortalité">Mortalité</option><option value="réforme">Réforme / vente</option><option value="transfert">Transfert</option></select>
        </div>
        <div class="field span-2"><label>Note</label><input id="mo-note"></div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" data-action="save-mort" data-id="${f.id}">Valider</button>
        <button class="btn btn-ghost" data-action="close-modal">Annuler</button>
      </div>`);
  }
  if (act === "save-mort") {
    const f = state.flocks.find((x) => x.id === btn.dataset.id);
    const q = num(document.getElementById("mo-n").value);
    f.count = Math.max(0, num(f.count) - q);
    state.flockEvents.push({
      id: uid(), date: document.getElementById("mo-d").value, building: f.building,
      type: document.getElementById("mo-t").value, qty: q, note: document.getElementById("mo-note").value,
    });
    save(); closeModal(); render(); toast("Effectif mis à jour");
  }
  if (act === "del-event") {
    state.flockEvents = state.flockEvents.filter((x) => x.id !== btn.dataset.id);
    save(); render();
  }
  if (act === "add-sale") {
    const qty = num(document.getElementById("s-qty").value);
    const pu = num(document.getElementById("s-pu").value);
    const kind = document.getElementById("s-kind").value;
    state.sales.push({
      id: uid(),
      date: document.getElementById("saisie-date") ? document.getElementById("saisie-date").value : ui.saisieDate,
      kind, qty, unit: kind === "oeufs" ? "pltx" : "têtes",
      unitPrice: pu, total: qty * pu,
      payment: document.getElementById("s-pay").value,
      client: document.getElementById("s-client").value,
      note: document.getElementById("s-note").value,
    });
    if (kind === "poule" || kind === "coq") {
      const flock = state.flocks.find((f) => f.category === kind);
      if (flock) flock.count = Math.max(0, num(flock.count) - qty);
    }
    save(); toast("Vente ajoutée"); render();
  }
  if (act === "edit-sale") saleForm(state.sales.find((s) => s.id === btn.dataset.id));
  if (act === "save-sale") {
    const s = state.sales.find((x) => x.id === btn.dataset.id);
    const qty = num(document.getElementById("sf-q").value);
    const pu = num(document.getElementById("sf-pu").value);
    Object.assign(s, {
      date: document.getElementById("sf-d").value,
      client: document.getElementById("sf-c").value,
      kind: document.getElementById("sf-k").value,
      payment: document.getElementById("sf-p").value,
      qty, unitPrice: pu, total: qty * pu,
      note: document.getElementById("sf-n").value,
    });
    save(); closeModal(); render(); toast("Vente corrigée");
  }
  if (act === "del-sale") {
    state.sales = state.sales.filter((s) => s.id !== btn.dataset.id);
    save(); render();
  }
  if (act === "open-credit") creditForm(null);
  if (act === "edit-credit") creditForm((state.credits || []).find((c) => c.id === btn.dataset.id));
  if (act === "add-credit-day") {
    const row = collectCreditFrom("cr-");
    upsertCredit(null, row, true);
    toast("Crédit enregistré");
    render();
  }
  if (act === "save-credit") {
    const row = collectCreditFrom("cf-");
    upsertCredit(btn.dataset.id, row, false);
    closeModal(); render(); toast("Crédit enregistré");
  }
  if (act === "del-credit") {
    state.credits = (state.credits || []).filter((c) => c.id !== btn.dataset.id);
    save(); render();
  }
  if (act === "open-vet") {
    openModal(`
      <h3 style="font-family:var(--font);margin:0 0 12px">Nouveau produit</h3>
      <div class="form-grid" style="grid-template-columns:1fr 1fr">
        <div class="field span-2"><label>Nom</label><input id="v-n"></div>
        <div class="field"><label>Catégorie</label>
          <select id="v-c"><option value="veto">Véto</option><option value="vaccin">Vaccin</option><option value="emballage">Emballage</option></select>
        </div>
        <div class="field"><label>Quantité</label><input type="number" step="0.1" id="v-q" value="1"></div>
        <div class="field"><label>Unité</label><input id="v-u" value="kg"></div>
        <div class="field"><label>Valeur (F)</label><input type="number" id="v-val" value="0"></div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" data-action="save-vet">Ajouter</button>
        <button class="btn btn-ghost" data-action="close-modal">Annuler</button>
      </div>`);
  }
  if (act === "save-vet") {
    state.vet.push({
      id: uid(), name: document.getElementById("v-n").value,
      category: document.getElementById("v-c").value,
      qty: num(document.getElementById("v-q").value),
      unit: document.getElementById("v-u").value,
      value: num(document.getElementById("v-val").value),
    });
    save(); closeModal(); render();
  }
  if (act === "del-vet") {
    state.vet = state.vet.filter((v) => v.id !== btn.dataset.id);
    save(); render();
  }
  if (act === "add-feed") {
    state.feed.push({
      id: uid(), building: document.getElementById("al-b").value,
      month: ui.month, type: document.getElementById("al-t").value,
      kg: num(document.getElementById("al-kg").value),
    });
    save(); render();
  }
  if (act === "del-feed") {
    state.feed = state.feed.filter((f) => f.id !== btn.dataset.id);
    save(); render();
  }
  if (act === "save-note") {
    state.monthNotes[ui.month] = document.getElementById("month-note").value;
    save(); toast("Note enregistrée");
  }
  if (act === "save-params") {
    Object.assign(state.settings, {
      orgName: document.getElementById("p-name").value,
      orgAddress: document.getElementById("p-addr").value,
      orgTel: document.getElementById("p-tel").value,
      plateauSize: num(document.getElementById("p-size").value),
      prixPlateau: num(document.getElementById("p-pl").value),
      prixPoule: num(document.getElementById("p-poule").value),
      prixCoq: num(document.getElementById("p-coq").value),
      prixCuisine: num(document.getElementById("p-cuis").value),
      prixAumone: num(document.getElementById("p-aum").value),
      prixLiberal: num(document.getElementById("p-lib").value),
      prixCreditPlateau: num(document.getElementById("p-cred").value),
      priceSchemeV2: true,
    });
    document.querySelectorAll("[data-ent]").forEach((inp) => {
      const e = state.entities.find((x) => x.id === inp.dataset.ent);
      if (e) e[inp.dataset.k] = inp.value;
    });
    save(); toast("Paramètres enregistrés"); render();
  }
  if (act === "export") {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `poulailler-${ui.month}.json`;
    a.click();
  }
  if (act === "reset-seed") {
    if (confirm("Recharger l'exemple août 2026 ? Les saisies actuelles seront remplacées.")) {
      state = seed(); save(); render(); toast("Exemple rechargé");
    }
  }
  if (act === "wipe") {
    if (confirm("Effacer toutes les données ?")) {
      localStorage.removeItem(KEY);
      state = seed();
      state.eggs = {}; state.sales = []; state.credits = []; state.feed = [];
      state.vet = []; state.flockEvents = []; state.monthNotes = {};
      save(); render();
    }
  }
});

document.addEventListener("change", (e) => {
  const fiche = e.target.closest("[data-fiche]");
  if (fiche) {
    const date = fiche.dataset.fiche;
    const rec = getDay(date);
    rec[fiche.dataset.k] = fiche.value === "" ? 0 : num(fiche.value);
    state.eggs[date] = rec;
    save();
    renderFiche();
    return;
  }
  const vet = e.target.closest("[data-vet]");
  if (vet) {
    const item = state.vet.find((v) => v.id === vet.dataset.vet);
    if (item) {
      const k = vet.dataset.k;
      item[k] = (k === "name" || k === "unit") ? vet.value : num(vet.value);
      save();
      if (k !== "name" && k !== "unit") renderStock();
    }
    return;
  }
  const cr = e.target.closest("[data-credit]");
  if (cr) {
    const item = (state.credits || []).find((c) => c.id === cr.dataset.credit);
    if (item) {
      const k = cr.dataset.k;
      if (k === "client" || k === "phone" || k === "due" || k === "note") item[k] = cr.value;
      else item[k] = num(cr.value);
      if (k === "qty" || k === "unitPrice") item.total = num(item.qty) * num(item.unitPrice);
      save();
      if (k === "qty" || k === "unitPrice" || k === "paid") renderCredits();
    }
  }
});

document.addEventListener("click", (e) => {
  if (e.target.id === "modal") closeModal();
});

window.addEventListener("DOMContentLoaded", () => {
  document.getElementById("brand-mark").innerHTML = henSvg();
  setView("dashboard");
});
